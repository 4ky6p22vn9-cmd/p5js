<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유호현의 p5.js 포트폴리오</title>
    <style>
        /* 세련된 웹 폰트(Pretendard) 적용 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 50px 24px;
            background: #f4f7f6; /* 부드러운 배경색 */
            color: #333;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        /* 2행 2열 그리드 구조 */
        #projects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            width: 100%;
            max-width: 900px;
            gap: 24px;
        }

        /* 각 작품을 담는 카드 디자인 */
        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); /* 부드러운 그림자 */
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        /* 마우스(또는 터치)를 올렸을 때 카드가 살짝 떠오르는 효과 */
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        /* 카드 상단 과제 제목 바 */
        .card-header {
            padding: 12px 16px;
            background: #2c3e50;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
        }

        .card-header span {
            color: #bdc3c7;
            font-size: 0.8rem;
            font-weight: 400;
        }

        .cell {
            aspect-ratio: 16 / 9;
            position: relative;
            background: #e9ecef;
            width: 100%;
        }

        /* p5.js 캔버스를 깔끔하게 축소해서 보여주는 설정 */
        .cell iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            border: none;
            transform-origin: top left;
            transform: scale(0.5);
        }

        /* 화면이 좁은 기기(모바일)에서는 1열로 보이도록 반응형 처리 */
        @media (max-width: 768px) {
            #projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>유호현의 p5.js 작품 갤러리</h1>
        <p class="subtitle">Creative Coding Portfolio 1~4</p>
    </header>

    <main id="projects">

        <div class="card">
            <div class="card-header">과제 1 <span>정적 작품</span></div>
            <div class="cell">
                <iframe src="sample1/index.html"></iframe>
            </div>
        </div>

        <div class="card">
            <div class="card-header">과제 4 <span>동적 작품</span></div>
            <div class="cell">
                <iframe src="sample4/index.html"></iframe>
            </div>
        </div>

        <div class="card">
            <div class="card-header">과제 2 <span>정적 작품</span></div>
            <div class="cell">
                <iframe src="sample2/index.html"></iframe>
            </div>
        </div>

        <div class="card">
            <div class="card-header">과제 3 <span>동적 작품</span></div>
            <div class="cell">
                <iframe src="sample3/index.html"></iframe>
            </div>
        </div>

    </main>

</body>
</html>
