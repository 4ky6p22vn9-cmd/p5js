<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>유호현의 p5.js 포트폴리오</title>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Pretendard', sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 50px 24px;
            background: #f4f7f6;
            color: #333;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #2c3e50;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        #projects {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            width: 100%;
            max-width: 950px; /* 여백 확보를 위해 소폭 확장 */
            gap: 24px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
        }

        /* 상단 타이틀 바 - 영역을 독립시켜 아래 3:2 비율에 영향을 주지 않음 */
        .card-header {
            padding: 14px 18px;
            background: #2c3e50;
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0; 
        }

        .card-header span {
            color: #bdc3c7;
            font-size: 0.8rem;
            font-weight: 400;
        }

        /* 실제 작품 영역만 정확히 3:2 비율로 강제 고정 */
        .cell {
            aspect-ratio: 3 / 2;
            position: relative;
            background: #e9ecef;
            width: 100%;
            overflow: hidden;
        }

        /* p5.js 표준 해상도(600x400) 고정 후 스크립트로 확대/축소 */
        .cell iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 400px;
            border: none;
            transform-origin: top left;
        }

        @media (max-width: 768px) {
            #projects {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>유호현의 p5.js 작품 갤러리</h1>
        <p class="subtitle">Creative Coding Portfolio 1~4</p>
    </header>

    <main id="projects">

        <div class="card">
            <div class="card-header">과제 1 <span>정적 작품</span></div>
            <div class="cell">
                <iframe src="sample1/index.html"></iframe>
            </div>
        </div>

        <div class="card">
            <div class="card-header">과제 4 <span>동적 작품</span></div>
            <div class="cell">
                <iframe src="sample4/index.html"></iframe>
            </div>
        </div>

        <div class="card">
            <div class="card-header">과제 2 <span>정적 작품</span></div>
            <div class="cell">
                <iframe src="sample2/index.html"></iframe>
            </div>
        </div>

        <div class="card">
            <div class="card-header">과제 3 <span>동적 작품</span></div>
            <div class="cell">
                <iframe src="sample3/index.html"></iframe>
            </div>
        </div>

    </main>

    <script>
        function fitCanvasToCell() {
            const cells = document.querySelectorAll('.cell');
            cells.forEach(cell => {
                const iframe = cell.querySelector('iframe');
                if (iframe) {
                    const currentCellWidth = cell.clientWidth;
                    // 기본 가로 600px을 기준으로 현재 비율 계산
                    const scaleFactor = currentCellWidth / 600;
                    iframe.style.transform = `scale(${scaleFactor})`;
                }
            });
        }

        // 초기 실행 및 브라우저 크기 변경 시 실시간 반영
        window.addEventListener('DOMContentLoaded', fitCanvasToCell);
        window.addEventListener('load', fitCanvasToCell);
        window.addEventListener('resize', fitCanvasToCell);
    </script>

</body>
</html>
